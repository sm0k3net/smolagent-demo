[project]
name = "pentest-systems-assistant"
version = "0.2.0"
description = "AI-powered penetration testing assistant with OSINT, scanning tools, browser automation, and professional reporting."
authors = [{ name = "sm0k3net" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["owasp", "security-testing", "pentesting", "smolagents"]
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "smolagents[openai]",
  "httpx",
  "pydantic",
  "python-dotenv",
  "jinja2",
  "websockets",
  "orjson",
  "rich",
  "openai",
  "playwright",
  "python-multipart"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-requests"]
browser = ["playwright"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

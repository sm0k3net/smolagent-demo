[project]
name = "owasp-smolagent"
version = "0.2.0"
description = "SmolAgent powered OWASP penetration testing assistant with OSINT, scanning tools, browser automation, and professional reporting."
authors = [ { name = "Your Name" } ]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "smolagents[openai]",
  "httpx",
  "pydantic",
  "python-dotenv",
  "jinja2",
  "websockets",
  "orjson",
  "rich",
  "openai",
  "playwright"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-requests"]
browser = ["playwright"]
pdf = ["weasyprint"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

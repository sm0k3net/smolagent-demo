[project]
name = "owasp-smolagent"
version = "0.1.0"
description = "SmolAgent powered OWASP helper (Top10 classification, testing scenarios, standards guidance, search)."
authors = [ { name = "Your Name" } ]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "smolagents[openai]",
  "httpx",
  "pydantic",
  "python-dotenv",
  "jinja2",
  "websockets",
  "orjson",
  "rich",
  "openai"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-requests"]
browser = ["playwright"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
